<meta property="og:image" content="@@OGIMG@@"><meta property="article:published_time" content="@@ISO@@"><meta name="twitter:card" content="summary_large_image">

<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Halaman tanpa hero: navbar putih dengan tulisan biru muda */
.tanpa-hero .navbar{background:rgba(255,255,255,.96);backdrop-filter:blur(14px);border-bottom-color:var(--line);box-shadow:0 8px 30px rgba(5,13,31,.06)}
.tanpa-hero .navbar .nav-inner{padding-block:13px}
.tanpa-hero .navbar .brand{color:#0a8ae6}
.tanpa-hero .navbar .menu-toggle span{background:#0a8ae6}
.tanpa-hero .navbar .logo-light{display:none}.tanpa-hero .navbar .logo-dark{display:block}
@media(min-width:901px){
.tanpa-hero .navbar .nav-menu>a:not(.btn),.tanpa-hero .navbar .dropdown-btn,.tanpa-hero .navbar .prefs{color:#0a8ae6}
.tanpa-hero .navbar .nav-menu>a:not(.btn):hover,.tanpa-hero .navbar .dropdown-btn:hover{color:var(--gold-teks)}
.tanpa-hero .navbar .nav-menu a[aria-current=page]{color:var(--gold-teks)!important}
}
[data-theme=dark] .tanpa-hero .navbar{background:rgba(6,14,32,.92);box-shadow:0 8px 30px rgba(0,0,0,.35)}
[data-theme=dark] .tanpa-hero .navbar .brand{color:#4db8ff}
[data-theme=dark] .tanpa-hero .navbar .menu-toggle span{background:#4db8ff}
@media(min-width:901px){
[data-theme=dark] .tanpa-hero .navbar .nav-menu>a:not(.btn),[data-theme=dark] .tanpa-hero .navbar .dropdown-btn,[data-theme=dark] .tanpa-hero .navbar .prefs{color:#4db8ff}
[data-theme=dark] .tanpa-hero .navbar .nav-menu a[aria-current=page]{color:var(--gold)!important}
}
</style>
<link rel="stylesheet" href="../css/artikel.css">
</head>
<body class="tanpa-hero">
@@NAV@@
<main>
<section class="ad-hero"><div class="ad-wrap">
<nav class="ad-crumbs" aria-label="Breadcrumb"><a href="../index.html">Beranda</a><span>/</span><a href="../artikel.html">Artikel</a><span>/</span><span aria-current="page">@@TITLE@@</span></nav>
<header class="ad-head"><div class="ad-meta"><span class="ad-cat">@@CAT@@</span><time datetime="@@ISO@@">@@DATE@@</time><span class="ad-dot" aria-hidden="true"></span><span>@@READ@@</span></div>
<h1 class="ad-title">@@TITLE@@</h1></header>
<figure class="ad-cover"><img src="../@@COVER@@" alt="@@TITLE@@" width="1600" height="900" fetchpriority="high"></figure>
</div></section>
<section class="ad-section"><div class="ad-wrap">
<div class="ad-layout">
<article class="ad-content">
<p class="ad-intro">@@INTRO@@</p>
@@SECTIONS@@
</article>
<aside class="ad-side"><nav class="ad-toc" aria-label="Daftar isi"><strong>Daftar Isi</strong><ol>@@TOC@@</ol><a class="ad-back" href="../artikel.html">&larr; Kembali ke Artikel</a></nav></aside>
</div>
</div>
<div class="ad-relwrap"><div class="ad-wrap"><div class="ad-related"><h2>Artikel Terkait</h2><div class="ad-grid">@@MORE@@</div></div></div></div>
</section>
</main>
@@FOOT@@
<script src="../js/prefs.js"></script><script src="../js/latar.js"></script><script src="../js/artikel.js"></script>
<script>
/* Daftar Isi: tandai subjudul yang sedang dibaca */
(function () {
  var links = [].slice.call(document.querySelectorAll('.ad-toc a'));
  if (!links.length || !('IntersectionObserver' in window)) return;
  var io = new IntersectionObserver(function (es) {
    es.forEach(function (e) {
      if (!e.isIntersecting) return;
      links.forEach(function (a) { a.classList.toggle('is-active', a.getAttribute('href') === '#' + e.target.id); });
    });
  }, { rootMargin: '-20% 0px -70% 0px' });
  document.querySelectorAll('.ad-content h2[id]').forEach(function (h) { io.observe(h); });
})();
</script>
</body></html>
